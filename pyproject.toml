[project]
name = "final-capstone-project-agentic-ai-smart-research-assistant"
version = "0.1.0"
description = "Locally-hosted IEEE research assistant using multi-agent AI and RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "aiofiles",
    "sentence-transformers",
    "chromadb",
    "transformers",
    "PyMuPDF",
    "requests",
    "psutil>=7.2.2",
    "pytest>=9.0.3",
    "httpx>=0.28.1",
    "playwright>=1.60.0",
]
